version: 2

models:

  - name: stg_synthea__patients
    description: Cleaned and typed Synthea patient records.

    columns:

      - name: patient_id
        description: Unique identifier for a patient.
        data_tests:
          - not_null
          - unique

  - name: stg_synthea__claims
    description: Cleaned and typed Synthea claims records.
    
    columns:

    - name: claim_id
      description: Unique identifier for a claim. 
      data_tests:
        - not_null
        - unique

  - name: stg_synthea__claims_transactions
    description: Cleaned and typed Synthea claims transaction records.

    columns:

    - name: claim_transaction_id
      description: Unique identifier for a claim transaction.
      data_tests:
        - not_null
        - unique